<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="테스트모아">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3C9"/>
      <stop offset="1" stop-color="#FF8DB2"/>
    </linearGradient>
    <linearGradient id="petal" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEAF1"/>
    </linearGradient>
  </defs>

  <!-- 둥근 파스텔 배경 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bg)"/>
  <!-- 상단 광택 -->
  <ellipse cx="24" cy="18" rx="19" ry="13" fill="#FFFFFF" opacity="0.26"/>

  <!-- 꽃잎 5장 (사이트 대표 심볼) -->
  <g fill="url(#petal)">
    <ellipse cx="32" cy="18.5" rx="8.4" ry="9.4"/>
    <ellipse cx="45.2" cy="28" rx="8.4" ry="9.4" transform="rotate(72 45.2 28)"/>
    <ellipse cx="40.2" cy="43.6" rx="8.4" ry="9.4" transform="rotate(144 40.2 43.6)"/>
    <ellipse cx="23.8" cy="43.6" rx="8.4" ry="9.4" transform="rotate(216 23.8 43.6)"/>
    <ellipse cx="18.8" cy="28" rx="8.4" ry="9.4" transform="rotate(288 18.8 28)"/>
  </g>

  <!-- 꽃술 -->
  <circle cx="32" cy="32" r="7.6" fill="#FFD87A"/>
  <circle cx="29.6" cy="29.6" r="2.6" fill="#FFFFFF" opacity="0.75"/>
</svg>
